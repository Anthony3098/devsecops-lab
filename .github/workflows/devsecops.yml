name: DevSecOps Pipeline - Docker Image Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: 🧩 Checkout del código
        uses: actions/checkout@v4

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Construir imagen Docker
        run: |
          docker build -t devsecops-demo:latest .

      - name: 🔍 Escanear imagen con Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: 'devsecops-demo:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          vuln-type: 'os,library'

      - name: 📊 Publicar resultados del escaneo
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: 🚀 Push de imagen (si pasa escaneo)
        if: success()
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker tag devsecops-demo:latest $DOCKER_USER/devsecops-demo:latest
          docker push $DOCKER_USER/devsecops-demo:latest
