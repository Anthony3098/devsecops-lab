name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout del código
      uses: actions/checkout@v4

    - name: 🐍 Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 Instalar dependencias
      run: pip install -r requirements.txt

    - name: 🧪 Ejecutar pruebas unitarias
      run: |
        if [ -d "tests" ]; then
          pytest
        else
          echo "No hay pruebas que ejecutar."
        fi

    - name: 🛡️ Escanear código fuente con Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        exit-code: '0'

    - name: 🐳 Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Construir imagen Docker
      run: docker build -t devsecops-lab:${{ github.sha }} .

    - name: 🔍 Escanear imagen Docker con Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: devsecops-lab:${{ github.sha }}
        vuln-type: 'os,library'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '0'

    - name: ✅ Despliegue simulado
      if: success()
      run: echo "🚀 Desplegando versión segura..."
