name: DevSecOps Pipeline - Docker Image Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del código
        uses: actions/checkout@v4

      - name: 🧰 Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y curl wget git tar python3 python3-pip ca-certificates

      - name: 🐍 Verificar versión de Python
        run: python3 --version

      - name: 📦 Instalar dependencias del proyecto
        run: |
          if [ -f requirements.txt ]; then
            pip3 install -r requirements.txt || echo "⚠️ Algunas dependencias no se instalaron, continuando..."
          else
            echo "⚠️ No se encontró requirements.txt, omitiendo instalación."
          fi

      - name: 🧪 Ejecutar pruebas unitarias
        run: |
          if [ -d "tests" ]; then
            pip3 install pytest
            pytest || { echo "❗ Fallaron las pruebas unitarias"; exit 1; }
          else
            echo "No hay pruebas que ejecutar."
          fi

      - name: 🧠 Escanear vulnerabilidades de código con Bandit
        run: |
          pip3 install bandit
          bandit -r . -ll || true

      - name: 🔒 Escanear dependencias Python con Safety
        run: |
          pip3 install safety
          safety check --full-report || true

      - name: 🛡️ Escanear código fuente con Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: 🔧 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Construir imagen Docker
        run: |
          docker build -t devsecops-lab:${{ github.sha }} .
          echo "IMAGE_TAG=devsecops-lab:${{ github.sha }}" >> $GITHUB_ENV

      - name: 🔍 Escanear imagen Docker con Trivy (SCA)
        uses: aquasecurity/trivy-action@v0.24.0
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          vuln-type: 'os,library'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: 📊 Publicar resultados del escaneo en GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: 🚀 Push de imagen (si pasa escaneo)
        if: success()
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASS: ${{ secrets.DOCKER_PASS }}
        run: |
          echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
          docker tag ${{ env.IMAGE_TAG }} $DOCKER_USER/devsecops-lab:latest
          docker push $DOCKER_USER/devsecops-lab:latest

      - name: ✅ Despliegue simulado final
        if: success()
        run: echo "🚀 Despliegue completado con éxito. Imagen segura validada y publicada."
