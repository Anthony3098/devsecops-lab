name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout del código
      uses: actions/checkout@v4

    - name: 🧰 Instalar dependencias del sistema
      run: |
        sudo apt-get update
        sudo apt-get install -y curl wget git tar python3 python3-pip

    - name: 🐍 Verificar versión de Python
      run: python3 --version

    - name: 📦 Instalar dependencias del proyecto
      run: |
        if [ -f requirements.txt ]; then
          pip3 install -r requirements.txt || echo "⚠️ Algunas dependencias no se instalaron, continuando..."
        else
          echo "⚠️ No se encontró requirements.txt, omitiendo instalación."
        fi

    - name: 🧪 Ejecutar pruebas unitarias
      run: |
        if [ -d "tests" ]; then
          pytest
        else
          echo "No hay pruebas que ejecutar."
        fi

    - name: 🧠 Escanear vulnerabilidades de código con Bandit
      run: |
        pip3 install bandit
        bandit -r . -ll

    - name: 🔒 Escanear dependencias Python con Safety
      run: |
        pip3 install safety
        safety check --full-report || true

    - name: 🛡️ Escanear código fuente con Trivy
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        exit-code: '0'

    - name: 🐳 Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🏗️ Construir imagen Docker
      run: docker build -t devsecops-lab:${{ github.sha }} .

    - name: 🔍 Escanear imagen Docker con Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: devsecops-lab:${{ github.sha }}
        vuln-type: 'os,library'
        format: 'table'
        severity: 'HIGH,CRITICAL'
        ignore-unfixed: true
        exit-code: '0'

    - name: ✅ Despliegue simulado
      if: success()
      run: echo "🚀 Desplegando versión segura..."
